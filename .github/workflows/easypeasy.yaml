name: Gradle CI

on: 
  - push

jobs: 
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: '11'

      - name: Start MySQL container
        run: |
          docker run -d --rm \
            -p 3306:3306 \
            -e MYSQL_DATABASE=db \
            -e MYSQL_ROOT_PASSWORD=12345678 \
            mysql:latest

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test
